<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spark & Astro - Desktop Companion</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="chat/chat.css">
</head>
<body>

  <!-- 💬 Interactive Speech Bubble (Clippy Modern Style) -->
  <div id="speechBubbleContainer" class="speech-bubble-container hidden">
    <div class="speech-bubble">
      <div class="bubble-header">
        <div id="agentBadge" class="agent-badge">
          <span class="dot"></span>
          <span id="agentNameText">Spark</span>
        </div>
        <button id="btnCloseBubble" class="btn-close-bubble" title="Close">✕</button>
      </div>

      <div id="bubbleTitle" class="bubble-title">Hello there!</div>
      <div id="bubbleMessage" class="bubble-message">I'm ready to accompany you and monitor your AI agents.</div>
      <div id="bubbleCode" class="bubble-code" style="display: none;"></div>

      <div id="bubbleActions" class="bubble-actions">
        <!-- Dynamic action buttons injected here -->
      </div>
    </div>
  </div>

  <!-- ⌨️ Spark Quick-Input Command Hub (Multi-Agent Dispatcher) -->
  <div id="quickInputCommandHub" class="quick-input-hub hidden">
    <div class="quick-input-header">
      <span class="quick-input-title">⚡ Command Hub</span>
      <div id="agentPillsList" class="agent-pills-list">
        <button class="agent-pill active" data-agent="all">🌐 All</button>
        <button class="agent-pill" data-agent="claude">🟣 Claude</button>
        <button class="agent-pill" data-agent="antigravity">🔵 Antigravity</button>
        <button class="agent-pill" data-agent="openclaw">🟢 OpenClaw</button>
      </div>
      <button id="btnCloseQuickInput" class="btn-close-quick-input" title="Close (Esc)">✕</button>
    </div>

    <div class="quick-input-body">
      <input type="text" id="quickPromptInput" class="quick-prompt-input" placeholder="Type prompt or @agent (Tab to switch)..." autocomplete="off" />
      <button id="btnSendPrompt" class="btn-send-prompt" title="Send (Enter)">➤</button>
    </div>

    <div class="quick-input-footer">
      <span class="quick-hint"><kbd>Tab</kbd> Switch agent &bull; <kbd>Enter</kbd> Send &bull; <kbd>Esc</kbd> Close</span>
    </div>
  </div>

  <!-- ⚡ Avatar Section (Dr. Octopus / Astro / Spark) -->
  <div class="avatar-section" id="avatarSection" title="Click to open Chat | Double click to switch character | Drag to move">
    <div class="spark-avatar-container" id="sparkAvatarContainer">
      <img id="sparkImg" class="spark-media" alt="Companion Avatar">
    </div>
    <div class="spark-shadow"></div>
    
    <!-- Status Pill -->
    <div class="status-pill" id="statusPill">
      <div class="status-pill-dot" id="statusPillDot"></div>
      <span class="status-pill-text" id="statusPillText">Dr. Octopus Ready</span>
    </div>
  </div>

  <!-- 💬 Chat Panel (Spark Messaging Center) -->
  <div id="chatPanel" class="chat-panel hidden">
    <div class="chat-header">
      <div class="chat-header-left">
        <div id="chatAgentBadge" class="chat-agent-badge">
          <span class="dot"></span>
          <span id="chatAgentName">Spark</span>
        </div>
        <span id="chatSessionTitle" class="chat-session-title">New Conversation</span>
      </div>
      <div class="chat-header-right">
        <button id="btnChatNew" class="chat-btn-icon" title="New Session">➕</button>
        <button id="btnChatSessions" class="chat-btn-icon" title="Sessions">☰</button>
        <button id="btnChatCollapse" class="chat-btn-icon" title="Collapse">✕</button>
      </div>
    </div>

    <div id="chatSessionsList" class="chat-sessions-list hidden">
      <!-- Session items injected here -->
    </div>

    <div id="chatMessages" class="chat-messages">
      <!-- Messages injected here -->
    </div>

    <div id="chatTypingIndicator" class="chat-typing-indicator hidden">
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-text">Agent is typing...</span>
    </div>

    <div class="chat-input-area">
      <select id="chatAgentSelect" class="chat-agent-select" title="Select agent">
        <option value="spark">⚡ Spark</option>
        <option value="hermes">🔴 Hermes</option>
        <option value="claude">🟣 Claude</option>
        <option value="codex">🟢 Codex</option>
        <option value="antigravity">🔵 Antigravity</option>
      </select>
      <input type="text" id="chatInput" class="chat-input" placeholder="Type a message..." autocomplete="off" />
      <button id="btnChatSend" class="chat-send-btn" title="Send (Enter)">➤</button>
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="lite.js"></script>
  <script src="app.js"></script>
  <script src="chat/chat.js"></script>
</body>
</html>
