<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spark & Astro - Desktop Companion</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 💬 Interactive Speech Bubble (Clippy Modern Style) -->
  <div id="speechBubbleContainer" class="speech-bubble-container hidden">
    <div class="speech-bubble">
      <div class="bubble-header">
        <div id="agentBadge" class="agent-badge">
          <span class="dot"></span>
          <span id="agentNameText">Spark</span>
        </div>
        <button id="btnCloseBubble" class="btn-close-bubble" title="Close">✕</button>
      </div>

      <div id="bubbleTitle" class="bubble-title">Hello there!</div>
      <div id="bubbleMessage" class="bubble-message">I'm ready to accompany you and monitor your AI agents.</div>
      <div id="bubbleCode" class="bubble-code" style="display: none;"></div>

      <div id="bubbleActions" class="bubble-actions">
        <!-- Dynamic action buttons injected here -->
      </div>
    </div>
  </div>

  <!-- ⚡ Avatar Section (Astro / Spark) -->
  <div class="avatar-section" id="avatarSection" title="Double click to switch character | Drag to move">
    <div class="spark-avatar-container" id="sparkAvatarContainer">
      <!-- Media elements & Canvas with real-time black background removal -->
      <canvas id="sparkCanvas" class="spark-media" width="140" height="140"></canvas>
      <video id="sparkVideo" muted playsinline loop style="display: none;"></video>
      <img id="sparkImg" style="display: none;" alt="Spark Avatar">
    </div>
    <div class="spark-shadow"></div>
    
    <!-- Status Pill -->
    <div class="status-pill" id="statusPill">
      <div class="status-pill-dot" id="statusPillDot"></div>
      <span class="status-pill-text" id="statusPillText">Astro Ready</span>
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
